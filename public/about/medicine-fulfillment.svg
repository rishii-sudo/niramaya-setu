<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" fill="none">
  <!-- Container Card -->
  <rect width="500" height="200" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Step 1: Catalog Search -->
  <g transform="translate(30, 30)">
    <rect width="115" height="120" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="37" y="16" width="40" height="40" rx="10" fill="#f0fdfa"/>
    <!-- Pill Pack Icon -->
    <rect x="47" y="24" width="20" height="12" rx="3" fill="#0b8f86"/>
    <circle cx="53" cy="30" r="2" fill="#ffffff"/>
    <circle cx="61" cy="30" r="2" fill="#ffffff"/>
    <text x="57" y="76" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">1. Browse Salt</text>
    <text x="57" y="94" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Essential Formulary</text>
    <text x="57" y="108" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0b8f86" text-anchor="middle">Generic &amp; Brand</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M155 90h20m-5-5l5 5-5 5" stroke="#0b8f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2: Prescription Verification Gate -->
  <g transform="translate(185, 25)">
    <rect width="130" height="130" rx="12" fill="#ffffff" stroke="#0b8f86" stroke-width="2"/>
    <rect x="45" y="14" width="40" height="40" rx="10" fill="#fef3c7"/>
    <!-- Rx Document with Stamp -->
    <rect x="52" y="20" width="26" height="26" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="59" y="32" font-family="serif" font-size="9" font-weight="800" fill="#d97706">Rx</text>
    <circle cx="70" cy="38" r="4" fill="#10b981"/>
    <path d="M68.5 38l1 1 2-2" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    <text x="65" y="76" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">2. Rx Verification</text>
    <text x="65" y="94" font-family="system-ui, sans-serif" font-size="9" fill="#d97706" font-weight="600" text-anchor="middle">Prescription Required</text>
    <text x="65" y="112" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Regulated Drugs Gate</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M325 90h20m-5-5l5 5-5 5" stroke="#0b8f86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3: Sub-Center Pickup / ASHA Handoff -->
  <g transform="translate(355, 30)">
    <rect width="115" height="120" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="37" y="16" width="40" height="40" rx="10" fill="#f0fdfa"/>
    <!-- Sub-center / Dispensary Clinic Icon -->
    <path d="M43 38V24h28v14" stroke="#0b8f86" stroke-width="2" stroke-linecap="round"/>
    <path d="M57 28v6m-3-3h6" stroke="#0b8f86" stroke-width="1.5" stroke-linecap="round"/>
    <text x="57" y="76" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">3. Sub-Center</text>
    <text x="57" y="94" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Village Dispensary</text>
    <text x="57" y="108" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0b8f86" text-anchor="middle">Community Pickup</text>
  </g>

  <!-- Bottom Notice -->
  <g transform="translate(80, 168)">
    <text x="170" y="15" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#92400e" text-anchor="middle">
      Prototype workflow • Regulated dispensary validation before delivery
    </text>
  </g>
</svg>
