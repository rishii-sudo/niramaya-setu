<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" fill="none">
  <!-- Container Card -->
  <rect width="500" height="220" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Module 1: Masked Identity Display -->
  <g transform="translate(30, 30)">
    <rect width="125" height="135" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="15" y="16" width="36" height="36" rx="10" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1"/>
    <!-- ID Mask Icon -->
    <path d="M25 34c0-4 3-7 8-7s8 3 8 7" stroke="#0b8f86" stroke-width="2" stroke-linecap="round"/>
    <circle cx="33" cy="24" r="4" fill="#0b8f86"/>
    <text x="15" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Masked Identity</text>
    <rect x="15" y="80" width="95" height="22" rx="4" fill="#f1f5f9"/>
    <text x="62" y="94" font-family="monospace" font-size="9" font-weight="700" fill="#0b8f86" text-anchor="middle">••••-••••-1284</text>
    <text x="15" y="118" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Zero raw Aadhaar leak</text>
  </g>

  <!-- Module 2: Security Shield & Consent -->
  <g transform="translate(185, 20)">
    <rect width="130" height="155" rx="14" fill="#ffffff" stroke="#0b8f86" stroke-width="2"/>
    <!-- Shield Top -->
    <path d="M65 24l35-12v35c0 28-22 46-35 55-13-9-35-27-35-55V12l35 12z" fill="#0b8f86"/>
    <path d="M52 48l9 9 18-18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="125" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">Consent Shield</text>
    <text x="65" y="142" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Patient-owned access</text>
  </g>

  <!-- Module 3: Tokenized QR Payload -->
  <g transform="translate(345, 30)">
    <rect width="125" height="135" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- QR Box -->
    <rect x="37" y="16" width="50" height="50" rx="8" fill="#0f172a"/>
    <rect x="43" y="22" width="14" height="14" fill="#ffffff"/>
    <rect x="47" y="26" width="6" height="6" fill="#0f172a"/>
    <rect x="67" y="22" width="14" height="14" fill="#ffffff"/>
    <rect x="71" y="26" width="6" height="6" fill="#0f172a"/>
    <rect x="43" y="46" width="14" height="14" fill="#ffffff"/>
    <rect x="47" y="50" width="6" height="6" fill="#0f172a"/>
    <rect x="67" y="46" width="6" height="6" fill="#ffffff"/>
    <rect x="75" y="54" width="6" height="6" fill="#ffffff"/>
    
    <text x="62" y="86" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Tokenized QR</text>
    <text x="62" y="104" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">No clinical data in QR</text>
    <text x="62" y="118" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0b8f86" text-anchor="middle">Opaque Lookup Only</text>
  </g>

  <!-- Bottom Privacy Banner -->
  <g transform="translate(75, 185)">
    <rect width="350" height="24" rx="12" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1"/>
    <text x="175" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0b8f86" text-anchor="middle">
      Strict Role Access Boundaries • Ephemeral Tokens • UIDAI Alignment
    </text>
  </g>
</svg>
