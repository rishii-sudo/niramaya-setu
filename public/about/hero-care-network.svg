<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131f"/>
      <stop offset="50%" stop-color="#0f1f2e"/>
      <stop offset="100%" stop-color="#0a1926"/>
    </linearGradient>
    <linearGradient id="loopPathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="65%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="returnPathGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="nodeShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="460" rx="24" fill="url(#heroBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8">
    <line x1="80" y1="30" x2="80" y2="430"/>
    <line x1="280" y1="30" x2="280" y2="430"/>
    <line x1="480" y1="30" x2="480" y2="430"/>
    <line x1="680" y1="30" x2="680" y2="430"/>
    <line x1="40" y1="120" x2="860" y2="120"/>
    <line x1="40" y1="230" x2="860" y2="230"/>
    <line x1="40" y1="340" x2="860" y2="340"/>
  </g>

  <!-- Primary Forward Continuum Pathway (1 -> 2 -> 3) -->
  <path d="M 160 170 C 220 110, 260 110, 330 170 C 400 230, 460 230, 530 170 C 600 110, 640 110, 710 170" 
        stroke="url(#loopPathGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 160 170 C 220 110, 260 110, 330 170 C 400 230, 460 230, 530 170 C 600 110, 640 110, 710 170" 
        stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 8" fill="none" opacity="0.8"/>

  <!-- Return Closed-Loop Feedback Pathway (3 -> 4 -> 1) -->
  <path d="M 710 240 C 660 360, 480 370, 380 340 C 270 310, 190 320, 160 240" 
        stroke="url(#returnPathGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="5 6" fill="none" opacity="0.9"/>

  <!-- Direction Arrows on Return Loop -->
  <g fill="#10b981">
    <polygon points="510,362 525,357 518,370"/>
    <polygon points="260,322 245,327 252,314"/>
  </g>

  <!-- Node 1: Village / ASHA Doorstep -->
  <g transform="translate(45, 75)" filter="url(#nodeShadow)">
    <rect width="195" height="190" rx="18" fill="#0f172a" stroke="#0d9488" stroke-width="1.5"/>
    <rect x="16" y="16" width="42" height="42" rx="12" fill="#0d9488"/>
    <!-- Icon: ASHA & Rural Patient -->
    <circle cx="31" cy="31" r="5" fill="#ffffff"/>
    <path d="M23 44c0-4.5 3.5-8 8-8s8 3.5 8 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="44" cy="35" r="3.5" fill="#5eead4"/>
    <path d="M39 45c0-2.8 2.2-5 5-5" stroke="#5eead4" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="135" y="18" width="44" height="20" rx="10" fill="#134e4a" stroke="#14b8a6" stroke-width="1"/>
    <text x="157" y="32" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#2dd4bf" text-anchor="middle">ACCESS</text>

    <text x="16" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Village / ASHA</text>
    <text x="16" y="98" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#2dd4bf">Doorstep Care &amp; Record</text>
    <text x="16" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Citizen Registration</text>
    <text x="16" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Longitudinal Health Vitals</text>
    <text x="16" y="154" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Offline Field Resilience</text>
  </g>

  <!-- Node 2: Referral / Care Continuity Gateway -->
  <g transform="translate(270, 75)" filter="url(#nodeShadow)">
    <rect width="195" height="190" rx="18" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="16" y="16" width="42" height="42" rx="12" fill="#2563eb"/>
    <!-- Icon: Referral QR & Transfer Routing -->
    <rect x="27" y="27" width="20" height="20" rx="4" fill="#ffffff"/>
    <rect x="31" y="31" width="4" height="4" fill="#1e3a8a"/>
    <rect x="39" y="31" width="4" height="4" fill="#1e3a8a"/>
    <rect x="31" y="39" width="4" height="4" fill="#1e3a8a"/>
    <rect x="39" y="39" width="4" height="4" fill="#2563eb"/>

    <rect x="135" y="18" width="44" height="20" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
    <text x="157" y="32" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#93c5fd" text-anchor="middle">REFER</text>

    <text x="16" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Care Continuity</text>
    <text x="16" y="98" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#60a5fa">Closed-Loop Referral</text>
    <text x="16" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Tokenized QR Transfer</text>
    <text x="16" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Clinical Urgency Triage</text>
    <text x="16" y="154" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Facility Bed Coordination</text>
  </g>

  <!-- Node 3: Doctor / Facility Operations -->
  <g transform="translate(495, 75)" filter="url(#nodeShadow)">
    <rect width="195" height="190" rx="18" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="16" y="16" width="42" height="42" rx="12" fill="#4f46e5"/>
    <!-- Icon: Hospital & Stethoscope Specialist -->
    <path d="M26 44V26h22v18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M37 30v8m-4-4h8" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="48" cy="27" r="4" fill="#a5b4fc"/>

    <rect x="135" y="18" width="44" height="20" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
    <text x="157" y="32" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#c7d2fe" text-anchor="middle">TREAT</text>

    <text x="16" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Doctor / Facility</text>
    <text x="16" y="98" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#a5b4fc">Secondary &amp; Tertiary Care</text>
    <text x="16" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Verified Intake Scanning</text>
    <text x="16" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Clinical Decision Making</text>
    <text x="16" y="154" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Electronic Discharge Orders</text>
  </g>

  <!-- Node 4: Patient Follow-Up & Rehabilitation Loop -->
  <g transform="translate(710, 75)" filter="url(#nodeShadow)">
    <rect width="155" height="190" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="16" y="16" width="42" height="42" rx="12" fill="#059669"/>
    <!-- Icon: Follow-up Check & Recovery -->
    <circle cx="37" cy="37" r="12" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <path d="M31 37l4 4 8-8" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="95" y="18" width="44" height="20" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="117" y="32" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#6ee7b7" text-anchor="middle">FOLLOW</text>

    <text x="16" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">Follow-up Loop</text>
    <text x="16" y="98" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#34d399">Community Recovery</text>
    <text x="16" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• 48-Hour Alerts</text>
    <text x="16" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Post-Discharge Visit</text>
    <text x="16" y="154" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">• Confirmed Closure</text>
  </g>

  <!-- Center Bottom Loop Callout Badge -->
  <g transform="translate(270, 390)">
    <rect width="360" height="40" rx="20" fill="#020617" stroke="#334155" stroke-width="1"/>
    <circle cx="24" cy="20" r="5" fill="#10b981"/>
    <text x="40" y="24" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#e2e8f0">
      Closed-Loop Guarantee • Zero Patient Drop-Off in Rural Transit
    </text>
  </g>
</svg>
