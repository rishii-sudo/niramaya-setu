<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Background Badge -->
  <rect width="48" height="48" rx="12" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.5"/>
  <!-- Tele-consultation Monitor Screen -->
  <rect x="8" y="11" width="32" height="23" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <!-- Video Camera Element on Top -->
  <rect x="20" y="8" width="8" height="3" rx="1.5" fill="#0b8f86"/>
  <!-- Split Screen Partition -->
  <line x1="24" y1="11" x2="24" y2="34" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Left Side: Doctor -->
  <circle cx="16" cy="19" r="3.5" fill="#0b8f86"/>
  <path d="M11 30c0-2.8 2.2-5 5-5s5 2.2 5 5" stroke="#0b8f86" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right Side: Patient -->
  <circle cx="32" cy="19" r="3.5" fill="#0284c7"/>
  <path d="M27 30c0-2.8 2.2-5 5-5s5 2.2 5 5" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Monitor Stand -->
  <path d="M20 34l-2 4h12l-2-4" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
