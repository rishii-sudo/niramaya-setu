<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Background Badge -->
  <rect width="48" height="48" rx="12" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.5"/>
  <!-- Field Smartphone -->
  <rect x="11" y="9" width="18" height="30" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="20" cy="34" r="1.5" fill="#0f172a"/>
  <!-- Offline Cloud Slashing on Phone Screen -->
  <path d="M15 19a3.5 3.5 0 0 1 6.5-1.5 2.5 2.5 0 0 1 3.5 2.5h-10z" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <line x1="14" y1="23" x2="26" y2="15" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Background Sync Loop Arrows -->
  <g transform="translate(23, 17)">
    <circle cx="11" cy="11" r="10" fill="#f0fdfa" stroke="#0b8f86" stroke-width="1.8" stroke-dasharray="8 6"/>
    <!-- Arrow Head 1 -->
    <path d="M18 6l3 2-2 3" stroke="#0b8f86" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrow Head 2 -->
